baseURL: "https://example.org/"
title: "Inaline 博客"
theme: "inaline-theme"

defaultContentLanguage: "zh-cn"
locale: "zh-cn"
hasCJKLanguage: true

pagination:
  pagerSize: 10

params:
  description: "个人技术博客"
  author: "Inaline"

  # -------------------------------------------------------------------------
  # 文章末尾信息卡的许可协议
  # name 留空 / 整块删掉 → 显示"保留所有权利"；url 留空 → 只显示名称
  # -------------------------------------------------------------------------
  article_meta:
    license:
      name: "CC BY-NC-SA 4.0"
      url: "https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh"

  # -------------------------------------------------------------------------
  # 评论（Waline）
  #
  # 文章评论区从 Waline 服务端取数据；服务端见 waline/ 目录（npm start）。
  # server：服务地址。本地开发默认 http://localhost:8360；上线时换成公网地址。
  #   站点走 https 时必须配 https 的 Waline 地址，否则混合内容会被浏览器拦截。
  # enable：false 时评论区与相关脚本都不渲染 / 不加载。
  # page_size：每页顶层评论数。回复挂在父评论下，不单独分页。
  # avatar_prefix：表单预览头像的前缀，仅用于非 QQ 情况，
  #   需与 Waline 服务端的头像服务一致；默认 Libravatar。
  #   昵称为纯数字或邮箱为 <数字>@qq.com 时自动取 QQ 头像（复刻 Waline 默认规则）。
  # -------------------------------------------------------------------------
  waline:
    enable: true
    server: "http://localhost:8360"
    page_size: 10
    avatar_prefix: "https://seccdn.libravatar.org/avatar/"

    # 表情选项卡，按数组顺序显示：
    # - 图片表情包：preset 写 @waline/emojis 的预设名（qq / alus / bilibili …），
    #   也可以写完整目录 URL；客户端会读取 <preset>/info.json。
    #   name 可选，用来覆盖预设自带的显示名。
    # - 文本表情（颜文字）：type: "text"，items 直接写要插入的文本。
    #   提交时会包一层 <span class="wl-kaomoji">，避免 Markdown 误伤 * / _。
    # 删除整个 emoji 项 → 表单里的表情按钮自动隐藏。
    emoji:
      - preset: "qq"
        name: "QQ"
      - name: "颜文字"
        type: "text"
        items:
          - "(๑•̀ㅂ•́)و✧"
          - "(*/ω＼*)"
          - "(´▽｀)ʃ♡ƪ"
          - "(￣▽￣)~*"
          - "(╯°□°）╯︵ ┻━┻"
          - "┬─┬ ノ( ゜-゜ノ)"
          - "(・ω・)ノ"
          - "✧(≖ ◡ ≖✿)"
          - "(。・ω・。)"
          - "(๑•́ ₃ •̀๑)"
          - "( ´ ▽ ｀ )ﾉ"
          - "(づ｡◕‿‿◕｡)づ"
          - "ヽ(•‿•)ノ"
          - "(≧∇≦)ﾉ"
          - "(｡•́︿•̀｡)"
          - "(๑•́ ∀ •̀๑)"
          - "ヽ(￣ω￣(￣ω￣〃)ゝ"
          - "(´･ω･｀)"
          - "( ˘ω˘ )"
          - "（￣へ￣）"
          - "(๑¯ω¯๑)"
          - "( •̀ ω •́ )✧"
          - "(´,,•ω•,,)♡"
          - "(＠_＠;)"
          - "(°ー°〃)"
          - "(ー_ー)!!"
          - "( ﾟДﾟ)"
          - "(゜-゜)"
          - "(；ω；)"
          - "(•̀ᴗ•́)و"

  # -------------------------------------------------------------------------
  # 首页背景图 / Hero
  # covers：封面图列表（assets 下的路径），可以配置多张
  # - 这些图铺满**整个首页**（从首屏到页脚，滚动时图像固定不动），
  #   不再只是首屏 Hero 的背景
  # - 顺序即切换顺序
  # - 多于一张时，卡片左下角出现左右箭头循环切换（交叉淡入）
  # - 不配置 / 全部解析不到则回退主题内置的 images/cover/cover1.jpg
  # initial_cover：进入 / 刷新时展示哪张封面
  # - 填 covers 里的路径（如 images/cover/cover2.jpg）→ 每次都从它开始
  # - 填 random → 每次进入 / 刷新随机一张
  # - 留空 / 删除该行 → 从 covers 第一张开始
  # hitokoto：一言列表，页面加载后随机轮换、打字机逐字展示
  # - 写几条随机几条；只写一条时不循环删除，打完停住
  # - 留空 / 删除整个 hero 项则卡片不渲染
  # -------------------------------------------------------------------------
  hero:
    covers:
      - "images/cover/cover1.jpg"
      - "images/cover/cover2.jpg" # ← company-website/background-1（原 .png 实为 JPEG）
      - "images/cover/cover3.jpg" # ← company-website/background-2（同上）

    initial_cover: "random"

    # avatar：博主头像，浮在卡片上边缘上方居中，右侧是名称（取 params.author）
    # - 网络图片：直接写完整 URL（http:// 或 https://，原样引用）
    # - 本地图片：assets 下的路径（如 images/avatar.jpg），走 resources.Get
    # - 留空 / 删除该行 → 头像与名称整块不渲染
    # 注意：站点部署在 https 下时网络图片必须 https，http 会被按混合内容拦截
    avatar: "https://q.qlogo.cn/headimg_dl?dst_uin=2291374026&spec=640"

    hitokoto:
      - "我希望成为的幸福，仅仅为此我会在你身边。"
      - "愿你的道路漫长，充满奇迹，充满发现。"
      - "所有的日子都去吧，在生活中我快乐地向前。"

  # -------------------------------------------------------------------------
  # 首页文章列表顶部的轮播图（只在第一页显示）
  #
  # enable：总开关；items 为空 / 整块删掉则不渲染
  # autoplay：自动轮播；鼠标悬停、键盘焦点进入、系统开启"减少动态效果"时暂停
  # interval：自动轮播间隔（毫秒），低于 2000 按 6000 处理
  #
  # 每一项支持两种写法，可以混排：
  # 1. slug：引用已有文章，自动取标题、摘要、日期、封面与链接
  # 2. 手动：自行填写 title / summary / date / image / url
  #    image 支持网络 URL 与 assets 路径；url 支持站内路径、外链、mailto
  #
  # 所有卡片统一为整图背景：图片铺满整张卡片，底部渐变压暗，
  # 日期 / 标题 / 摘要压在图片底部。
  # -------------------------------------------------------------------------
  carousel:
    enable: true
    autoplay: true
    interval: 6000
    items:
      # 引用文章：标题 / 摘要 / 日期 / 封面 / 链接全部自动读取
      - slug: "hello-world"

      # 手动配置
      - title: "图片铺满整张卡片的轮播样式"
        summary: "图片铺满整张卡片，底部渐变压暗，标题与摘要在图片下方显示。"
        date: 2026-10-03T21:00:00+08:00
        image: "images/cover/cover2.jpg"
        url: "/posts/hugo-directory/"

      # 引用文章
      - slug: "hugo-directory"

  # -------------------------------------------------------------------------
  # 页脚
  # 从上到下的每一行都是可选的：对应的配置留空 / 删掉，整行就不渲染。
  # 凡是有 url 的项都自动生成超链接；url 留空则只显示文字。
  # 外链（http/https 开头）自动开新标签页，站内链接（/index.xml 等）走当前页。
  # -------------------------------------------------------------------------
  footer:
    # 备案号：一行一个，通常是"工信部备案 + 公安备案"两条
    # text 留空则该条不渲染（两条都空 → 整行不渲染）
    filings:
      - text: "" # 例：粤ICP备00000000号
        url: "https://beian.miit.gov.cn/" # 留空则不生成超链接
      - text: "" # 例：粤公网安备 00000000000000号
        url: ""

    # Powered by：渲染成"Powered by Hugo & theme inaline"，两个名字都可点。
    # 这是主题自带的身份信息，没得改也没必要改，故只留开关不给配置项
    powered_by: true

    # 访客统计：数字目前是占位符（显示 —），等 Waline 接上后由前端回填，
    # 见 partials/footer.html 里 data-footer-stat 那几处。false 则整行不渲染
    stats: true

    # 站点开始运行的时刻（RFC 3339，务必带时区）：
    # 页脚按它算出"已运行 X 天 X 小时 X 分 X 秒"，并逐秒走动
    # ← 改成你自己的建站时间
    since: "2025-01-01T00:00:00+08:00"

    # 底部链接。默认指向 Hugo 自动生成的 RSS 与站点地图，一般不用改
    links:
      - name: "RSS"
        url: "/index.xml"
      - name: "Sitemap"
        url: "/sitemap.xml"

    # 版权起始年份；结束年份取构建时的当前年。留空则只显示当前年
    copyright_since: 2025

  # -------------------------------------------------------------------------
  # 侧栏
  # 组件自上而下堆叠，一个组件一张卡；不想要的组件把 enable 关掉（或整块删掉）。
  # -------------------------------------------------------------------------
  sidebar:
    # 目录：只在文章页（posts 下的文章）渲染，排在博主信息卡之后、
    # 最新文章之前。
    # 条目取正文的 h2 / h3（Hugo 的 .Fragments.Headings，标题 id 构建时生成，
    # 不靠前端扫描 DOM）；标题数少于 min_headings 时整卡不渲染。
    # 目录与最新文章整组滚到 Header 下沿后吸顶，直到整组底部与正文卡片底部
    # 平齐再随页面滚走；标题行右侧显示阅读进度，当前章节高亮、父级可折叠，
    # 滚动时自动展开当前分支（逻辑见 post.js）。
    toc:
      enable: true
      title: "文章目录"
      min_headings: 2

    # 博主信息卡：头像 + 名称 + 一条分割线下的三项数据（文章 / 字数 / 评论）+ 联系方式。
    # 本卡没有标题组件——头像与名称本身就是它的标题
    profile:
      enable: true

      # 头像：同 hero.avatar——网络图片写完整 URL，本地图片写 assets 下的路径。
      # 留空则沿用 hero.avatar（同一个人，不必配两遍）
      avatar: ""

      # 名称：留空取 params.author
      name: ""

      # 联系方式：按需要的挑几个排成一行，顺序即渲染顺序。
      # 图标名只能用这 6 个（图形见 partials/icon.html，品牌色见 _tokens.scss）：
      #   rss / email / wechat / bilibili / github / qq
      # url  → 超链接：以 / 开头的当站内路径（走 relURL）；外链开新标签页；
      #        邮箱写 mailto:xxx@yyy
      # copy → 点击复制到剪贴板并弹一个"已复制"气泡（微信这类没有网页地址的用它）
      # 两个都不写的条目会被跳过，名字写错会在构建时告警
      socials:
        - name: "github"
          url: "https://github.com/inaline"

        - name: "rss"
          url: "/index.xml"

        - name: "email"
          url: "mailto:inaline@example.com" # ← 改成你的邮箱

        - name: "wechat"
          copy: "inaline_wx" # ← 改成你的微信号

        - name: "qq"
          copy: "2291374026"

        # - name: "bilibili"
        #   url: "https://space.bilibili.com/<uid>"

    # 最新文章：标题 + 图标 + 列表（缩略图 / 标题 / 发布日期）。
    # 列表页排在博主信息卡之后；文章页排在目录之后，与目录同处一个吸顶组。
    # 数据直接取 posts 分区，按发布日期倒序；count 为显示条数。
    # enable 关掉或整块删掉则整卡不渲染
    latest:
      enable: true
      title: "最新文章"
      count: 5

    # 近期评论：评论系统（Waline）尚未接入，列表内容是主题内置的占位数据，
    # 接上后由前端按 data-sidebar-comments 回填（见 sidebar-comments.html）。
    # 每条显示圆形头像、用户名、相对时间与正文；count 为显示条数。
    # enable 关掉或整块删掉则整卡不渲染
    comments:
      enable: true
      title: "近期评论"
      count: 5

    # 分类：整行显示"分类名 + 文章数"，按文章数降序。
    # 数据来自文章的 categories front matter；没有分类则整卡不渲染
    categories:
      enable: true
      title: "分类"
      count: 8

    # 标签：胶囊形标签自动换行，标签名后跟文章数，按文章数降序。
    # 数据来自文章的 tags front matter；没有标签则整卡不渲染
    tags:
      enable: true
      title: "标签"
      count: 20

# ---------------------------------------------------------------------------
# 导航：Hugo 标准菜单（menu.main），模板不硬编码（DESIGN.md §6.5）
# - 同级按 weight 升序，weight 相同再按名称
# - 层级用 parent + identifier：子项的 parent 指向父项的 identifier
# - pageRef 指向内容页，Hugo 解析成真实链接；外链直接写 url
# - 图标放在 params.icon，填 Font Awesome 类名（如 fa-solid fa-house）
# ---------------------------------------------------------------------------
menu:
  main:
    - name: "首页"
      pageRef: "/"
      weight: 10
      params:
        icon: "fa-solid fa-house"

    - name: "动态"
      pageRef: "/moments/"
      weight: 20
      params:
        icon: "fa-solid fa-comment-dots"

    - name: "友链"
      pageRef: "/links/"
      weight: 30
      params:
        icon: "fa-solid fa-link"

    - name: "关于"
      pageRef: "/about/"
      weight: 40
      params:
        icon: "fa-solid fa-circle-info"

    - name: "更多"
      identifier: "more"
      weight: 50
      params:
        icon: "fa-solid fa-ellipsis"

    - name: "归档"
      pageRef: "/archives/"
      parent: "more"
      weight: 10
      params:
        icon: "fa-solid fa-box-archive"

    - name: "标签"
      pageRef: "/tags/"
      parent: "more"
      weight: 20
      params:
        icon: "fa-solid fa-tag"

markup:
  # 代码高亮走 class：主题自带 Chroma 亮 / 暗两套样式（_chroma.scss），
  # 亮色默认生效，暗色在暗色模式下覆盖；行号由 Chroma 生成
  highlight:
    noClasses: false
    lineNos: true
  goldmark:
    renderer:
      unsafe: true
    # 数学公式：passthrough 让 $...$ / $$...$$ 原样保留，
    # 再由 render-passthrough.html 在构建时调用 transform.ToMath 渲染为 MathML。
    # 只启用 $ 系分隔符：\[...\] 会和正文里的转义方括号冲突
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
          inline:
            - ['$', '$']
