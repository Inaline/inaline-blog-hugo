<header class="site-header">
  <div class="header-inner">

    <div class="header-left">
      <a class="site-logo" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    </div>

    <nav class="site-nav" aria-label="主导航">
      <ul class="nav-list">
        {{- range site.Menus.main -}}
          {{ partial "nav-item.html" (dict "item" . "level" 1) }}
        {{- end }}
      </ul>
    </nav>

    <div class="header-actions">
      <button type="button" class="action-btn theme-toggle" aria-label="切换深浅色主题">
        <i class="fa-solid fa-moon icon-when-light" aria-hidden="true"></i>
        <i class="fa-solid fa-sun icon-when-dark" aria-hidden="true"></i>
      </button>
      <button type="button" class="action-btn search-toggle" aria-label="搜索" aria-controls="search-overlay" aria-expanded="false" title="搜索（Ctrl / ⌘ K）">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      </button>
    </div>

  </div>
</header>
