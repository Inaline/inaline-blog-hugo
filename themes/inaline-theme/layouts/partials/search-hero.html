{{/*
  搜索页顶部大图（§7.15）

  复用归档页的 .post-hero.archive-hero：封面 + 压暗遮罩 + 居中标题区；
  保留大搜索框，去掉统计行与热门标签，尽量把页面留给文章列表。
  下方默认空态，输入后由 Fuse.js 搜索结果（§7.15）。
*/}}
{{- $cover := partial "post-cover.html" (dict "page" . "index" 0) -}}
<section class="post-hero archive-hero search-hero">
  {{ with $cover }}
    <img class="post-hero-image" src="{{ . }}" alt="" fetchpriority="high" decoding="async">
  {{ end }}

  <header class="container post-header">
    <h1 class="post-title search-hero-title">
      <i class="fa-solid fa-magnifying-glass search-title-icon" aria-hidden="true"></i>
      <span>{{ .Title }}</span>
    </h1>
    <div class="search-hero-field">
      <div class="search-field">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input class="search-input" type="text" placeholder="搜索文章、动态或标签…" aria-label="搜索" autocomplete="off" data-search-page-input>
      </div>
    </div>
  </header>
</section>
