{{ define "main" }}
<div class="container">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>
  {{ if .Data.Terms }}
  <ul class="term-list">
    {{ range .Data.Terms.Alphabetical }}
      <li>
        <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
        <span class="count">({{ .Count }})</span>
      </li>
    {{ end }}
  </ul>
  {{ else }}
  <p class="empty-hint">暂无内容</p>
  {{ end }}
</div>
{{ end }}
